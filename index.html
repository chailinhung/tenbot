<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>載入中...</title>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        body { font-family: -apple-system, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background: #f4f7f9; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #06C755; border-radius: 50%; width: 45px; height: 45px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="loader"></div>
    <script>
        // 🔔 請確保此處為您 LIFF_ID
        const LIFF_ID = '2010215773-Z1Z86z5x'; 
        
        // 🔔 請確保此處為您後端 GAS Web App 的部署網址
        const GAS_WEB_APP_URL = 'https://script.google.com/macros/s/AKfycby7hWVeoB0l8BJM0WpqrudARsYIz-Jok1CYnZ5XhkwP94tLUaMs5eXklZMD8nIn34IK/exec';

        // 🔔 請將此處改為您 GitHub Pages 的專案根目錄網址（尾端不加斜線）
        const GITHUB_PAGES_BASE = 'https://chailinhung.github.io/tenbot';

        async function init() {
            // 🛡️【參數保護第 1 步】：一進網頁立刻備份原始 URL 參數至 sessionStorage
            const currentParams = new URLSearchParams(window.location.search);
            ['shop', 'gid', 'sid', 'type'].forEach(key => {
                const val = currentParams.get(key);
                if (val) {
                    sessionStorage.setItem('ORDER_' + key, val);
                }
            });

            // 🎯 超時設為 7 秒，確保 LIFF 不會卡死轉圈
            const timeoutPromise = new Promise(resolve => setTimeout(() => resolve({ userName: "" }), 7000));

            const liffPromise = (async () => {
                try {
                    await liff.init({ liffId: LIFF_ID });
                    if (!liff.isLoggedIn()) {
                        liff.login({ redirectUri: window.location.href });
                        return { waitLogin: true };
                    }

                    let userName = "";
                    // 第一層：極速本地解碼 ID Token（不需發送網路 API 請求）
                    const idToken = liff.getDecodedIDToken();
                    if (idToken && idToken.name) {
                        userName = idToken.name;
                    } else {
                        // 第二層：快讀 profile（若 2 秒未完成將由 timeoutPromise 自動降級）
                        const profile = await liff.getProfile();
                        userName = profile.displayName;
                    }
                    return { userName: userName || "" };

                } catch (e) {
                    console.error('LIFF Error:', e);
                    return { userName: "" };
                }
            })();

            // 競賽：看是 LIFF 先跑完還是超時先到
            const result = await Promise.race([liffPromise, timeoutPromise]);

            if (result && result.waitLogin) return; // 如果正在跳轉登入，則不執行後續

            const urlParams = new URLSearchParams(window.location.search);

            // 🛡️【參數保護第 2 步】：若網址參數遺失（如登入後或被轉址），自動從 sessionStorage 還原
            ['shop', 'gid', 'sid', 'type'].forEach(key => {
                if (!urlParams.get(key)) {
                    const savedVal = sessionStorage.getItem('ORDER_' + key);
                    if (savedVal) {
                        urlParams.set(key, savedVal);
                    }
                }
            });

            const finalName = (result && result.userName) ? result.userName : "";
            if (finalName) {
                urlParams.set('uName', finalName);
            }

            // 🎯 【關鍵分流邏輯】
            const orderType = urlParams.get('type') || "";

            if (orderType === 'SUBWAY') {
                // 1. 如果是 subway_order，導回 GAS
                window.location.replace(GAS_WEB_APP_URL + '?' + urlParams.toString());
            } else if (orderType === 'DRINK') {
                // 2. 如果是飲料，導向 GitHub 的 order_drink_ui.html
                window.location.replace(GITHUB_PAGES_BASE + '/order_drink_ui.html?' + urlParams.toString());
            } else {
                // 3. 其他狀況（一般餐點），導向 GitHub 的 order_ui.html
                window.location.replace(GITHUB_PAGES_BASE + '/order_ui.html?' + urlParams.toString());
            }
        }
        window.onload = init;
    </script>
</body>
</html>
